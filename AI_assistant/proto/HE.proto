Question 10: Calculate the Kepler orbit of a binary system with parameters: primary mass (m1) = 1.4, secondary mass (m2) = 17, semi-major axis (a) = 0.5, eccentricity (e) = 0.5, inclination (iota) = π/2, longitude of ascending node (Omega) = π, argument of periapsis (omega) = π/4. Plot the radial velocity curve of the primary star and the binary separation over time.
import sys
sys.path.append("..")
import numpy as np
import matplotlib.pyplot as plt
from hetoolbox.binary_common import Kepler_Orbit

# Define the Kepler orbit
Orbit_A = Kepler_Orbit(m1=1.4, m2=17, a=0.5, e=0.5, iota=np.pi/2, Omega=np.pi, omega=np.pi/4)

# Plot radial velocity curve
x = np.linspace(0, 6*np.pi, 100)
y = [Orbit_A.vlos_at_phase(phase=i) for i in x]
plt.plot(x, y)
plt.xlabel('Orbital Phase (rad)')
plt.ylabel('Line-of-sight Velocity (km/s)')
plt.title('Radial Velocity Curve of the Primary Star')
plt.show()

# Plot binary separation over time
pha = np.linspace(0, 6*np.pi, 100)
time = pha * Orbit_A.P / (2*np.pi)
sep = [Orbit_A.separation_at_t(t).value for t in time]
plt.plot(time, sep)
theunit = str(Orbit_A.separation_at_t(0).unit)
plt.xlabel(f'Time in {str(Orbit_A.P.unit)}')
plt.ylabel(f'Binary Separation in {theunit}')
plt.title('Binary Separation over Time')