Question 8: Create a short gamma-ray burst (sGRB) source and plot its light curve in the energy range [100e3, 200e3] eV, and its spectra in time intervals [0,0.5], [0.5,10], [10,20], [20,50], and [50,100] seconds.
import sys
sys.path.append("..")
import matplotlib.pyplot as plt
from hetoolbox.sources import sGRB

# Create a short GRB source
source_GRB_A = sGRB()

# Get flux-energy-time matrix
FET_matrix, E_array, T_array = source_GRB_A.FET()

# Plot light curve in [100e3, 200e3] eV
E_range = [100*1e3, 200*1e3]  # eV
light_curve = FET_matrix[:, (E_array >= E_range[0]) & (E_array <= E_range[1])].sum(axis=1)
plt.plot(T_array, light_curve)
plt.xlabel('Time (s)')
plt.ylabel('Flux (keV cm$^{-2}$ s$^{-1}$)')
plt.title(f'Light Curve in {E_range[0]}-{E_range[1]} keV Range')
plt.show()

# Plot spectra in specified time intervals
time_intervals = [[0, 0.5], [0.5, 10], [10, 20], [20, 50], [50, 100]]
for interval in time_intervals:
t_mask = (T_array >= interval[0]) & (T_array < interval[1])
spectrum = FET_matrix[t_mask, :].sum(axis=0)
plt.loglog(E_array/1e3, spectrum, label=f'Time: {interval[0]}-{interval[1]} s')

plt.xlabel('Energy (keV)')
plt.ylabel('Flux (keV cm$^{-2}$ s$^{-1}$ keV$^{-1}$)')
plt.title('Spectra at Different Time Intervals')
plt.legend()
