GW Universe Toolbox is a python module developed by Shu-Xu Yi, Gijs Nelemans and others in Radboud University Radio lab. The website of it is https://gw-universe.org

Instructions for GWToolbox:

Import the required package using:

```
from gwtoolbox.tools_earth import Tools
```

Then, create a toolset instance with:

```
Toolset = Tools(detector_type='hanford',
                event_type='bhbh',
                population='I')
```

Here:

The argument `detector_type` specifies the detector you want to simulate. Supported options are:

* 'virgo' — Advanced Virgo at design sensitivity
* 'kagra' — KAGRA at design sensitivity
* 'hanford' — Advanced LIGO Hanford at design sensitivity
* 'livingston' — Advanced LIGO Livingston at design sensitivity
* 'ligo' — Advanced LIGO at design sensitivity (list of ['hanford', 'livingston'])
* 'hanford-o3' — Advanced LIGO Hanford during O3 run
* 'livingston-o3' — Advanced LIGO Livingston during O3 run
* 'ligo-o3' — Advanced LIGO during O3 run (list of ['hanford-o3', 'livingston-o3'])
* 'ligo-o4' — Advanced LIGO during O4 run (list of ['hanford-o4', 'livingston-o4'])
* 'et' — Einstein Telescope (ET) at design sensitivity
* 'ce1' — Cosmic Explorer Stage 1 design sensitivity
* 'ce2' — Cosmic Explorer Stage 2 design sensitivity
* 'ligo-like' — Customized LIGO-like detector
* 'et-like' — Customized ET-like detector

You can also pass a list of detectors to create a detector network. Example:

```
Toolset = Tools(detector_type=['virgo', 'hanford', 'livingston'],
                event_type='bhbh',
                population='I')
```

The argument `event_type` specifies:

* 'bhbh' — Binary Black Hole mergers (BBH)
* 'nsns' — Double Neutron Star mergers (DNS)
* 'bhns' — Black Hole–Neutron Star mergers (BHNS)

The argument `population` specifies the population model. It accepts 'I' or 'II' for BBH and BHNS, and only 'I' for DNS.

To set the cosmology model:

```
Toolset.cosmoID = 'Planck18'
```

Supported cosmology models:

* 'WMAP5'
* 'WMAP7'
* 'WMAP9'
* 'Planck13'
* 'Planck15'
* 'Planck18' (default)

You can also define your own ΛCDM cosmology:

```
Toolset.cosmo_params({'H0':70, 'Om0':0.3, 'Tcmb':2.725})
```

Where:
H0 — Hubble constant
Om0 — Matter density fraction
Tcmb — CMB temperature

If `detector_type` is 'ligo-like', 'et-like', or a list of detectors, you can customize detector parameters:

```
from astropy.coordinates import EarthLocation

det_setup = {"LARM_VALUE": 3995,
             "PIN_VALUE": 125,
             "ITMT_VALUE": 0.014,
             "SRMT_VALUE": 0.2,
             "PRMT_VALUE": 0.03,
             "MTM_VALUE": 40,
             "SRMPHI_VALUE": -90,
             "LPRC_VALUE": 53,
             "LSRC_VALUE": 50.525}

location = EarthLocation.from_geodetic(lon=0., lat=0., height=0.)
Toolset.update_detector(det_setup=[det_setup], location=[location], index=[0])
```

Detector parameter meanings:
LARM_VALUE — Arm length (m)
PIN_VALUE — Laser input power (W)
ITMT_VALUE — Input test mass transmissivity
SRMT_VALUE — Signal recycling mirror transmissivity
PRMT_VALUE — Power recycling mirror transmissivity
MTM_VALUE — Mirror mass (kg)
SRMPHI_VALUE — Signal recycling phase offset (degrees)
LPRC_VALUE — Power recycling cavity length (m)
LSRC_VALUE — Signal recycling cavity length (m)

You may provide only a subset of parameters. Example:

```
det_setup = {"LARM_VALUE": 399.5,
             "PIN_VALUE": 1250}
```

`location` is an astropy EarthLocation object.
`index` determines which detector to update.

You can update population-model parameters:

```
Toolset.new_theta = {'R0': 13,
                     'tau': 3,
                     'mu': 3,
                     'c': 6,
                     'gamma': 2.5,
                     'mcut': 95,
                     'ql': 0.4,
                     'sig_x': 0.1}
```

Partial updates are allowed:

```
Toolset.new_theta = {'R0': 12,
                     'tau': 4}
```

Population model keywords:
BBH-Population I: [R0, tau, mu, c, gamma, mcut, ql, sig_x]
BBH-Population II: [R0, tau, mu, c, gamma, mcut, m_peak, m_peak_scale, m_peak_sig, ql, sig_x]
DNS-Population I: [R0, tau, m_mean, m_scale, m_low, m_high, chi_sigma]
BHNS-Population I: [R0, tau, m_mean, m_scale, m_low, m_high, mu, c, gamma, mcut, chi_sigma]
BHNS-Population II: [R0, tau, m_mean, m_sclae, m_low, m_high, mu, c, gamma, mcut, m_peak, m_peak_scale, m_peak_sig, chi_sigma]

