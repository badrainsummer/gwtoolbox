Subsection: Function
To compute expected detections:

```
num = Toolset.total_number(time_obs=time_obs, rho_cri=rho_cri)
```

Arguments:
time_obs — observation duration (minutes)
rho_cri — SNR threshold

Generate a synthetic catalogue:

```
df = Toolset.list_params(time_obs=time_obs,
                         rho_cri=rho_cri,
                         size=size,
                         dtp=False,
                         withangles=False,
                         witherrors=False)
```

DataFrame columns:
z — redshift
D — luminosity distance (Mpc)
m1, m2 — masses
X — effective spin
theta, varphi, inc, psi — source angles
rho — SNR
area — sky localization area
dtp — detection probability
dz, dm1, dm2, dX, dD — uncertainties

Note: Mac users should use multiprocessing guard:

```
if __name__ == "__main__":
```

or:

```
import multiprocessing; multiprocessing.set_start_method("fork")
```

Compute SNR:

```
snr = Toolset.snr(m1, m2, chi, z=None, D=None, theta=0,
                  varphi=0, psi=np.pi/2, iota=np.pi/2,
                  time=Time("2020-01-01 00:00:00", scale="utc"))
```

Compute SNR + sky area for networks:

```
snr, area = Toolset.snr_area(...)
```

Compute antenna pattern:

```
Fplus, Fcross = Toolset.ant_pat[0](theta, varphi, psi)
```

Obtain noise curve:

```
freq, strain = Toolset.sensitivity_curve(use_default=False)
```

For networks: returns list of [freq, strain].

